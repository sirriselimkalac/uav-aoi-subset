[project]
name = "uav-aoi-subset"
version = "0.0.1"
description = "Split large multispectral UAV image sets into subsets inside a KML/KMZ area of interest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sırrı Selim Kalaç" }]
requires-python = ">=3.11"
keywords = [
    "uav",
    "drone",
    "multispectral",
    "photogrammetry",
    "remote-sensing",
    "kml",
    "kmz",
    "aoi",
    "exif",
    "geotiff",
    "gis",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.urls]
Repository = "https://github.com/sirriselimkalac/uav-aoi-subset"

[project.scripts]
uav-aoi-subset = "uav_aoi_subset.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "requires_exiftool: test needs the exiftool executable on PATH (skipped otherwise)",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
